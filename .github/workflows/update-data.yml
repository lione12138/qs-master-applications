name: Update application windows

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      translation_only:
        description: "Only update missing programme translations"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "data/applications.json"
      - "data/predictions.json"
      - "data/programs.json"
      - "data/refresh-status.json"
      - "data/programme-groups.json"
      - "data/programme-translations.json"
      - "data/universities.json"
      - "data/ops/programme-candidates.json"
      - "data/ops/programme-candidates/**"
      - "data/ops/window-candidates.json"
      - "data/ops/window-candidates/**"
      - "data/ops/programme-catalog-state.json"
      - "data/ops/programme-catalog-state/**"
      - "scripts/update_programme_translations.py"
      - "src/gradwindow/**"
      - ".github/workflows/update-data.yml"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: application-data-state-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Validate pushed data
        if: github.event_name == 'push'
        run: |
          gradwindow predictions
          gradwindow validate
          gradwindow coverage

      - name: Run daily pipeline
        if: github.event_name != 'push' && !inputs.translation_only
        id: daily_pipeline
        env:
          SERPER_SEARCH_API_KEY: ${{ secrets.SERPER_SEARCH_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BROWSER_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: gradwindow pipeline --skip-build

      - name: Summarize dedicated adapter health
        if: >-
          github.event_name != 'push' &&
          !inputs.translation_only &&
          steps.daily_pipeline.outcome == 'success'
        id: adapter_health
        shell: bash
        run: |
          cat data/ops/reports/programme-adapter-health.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("data/ops/programme-adapter-health.json").read_text()
          )
          meta = payload["meta"]
          print(f"needs_maintenance={meta['summary']['needsMaintenance']}")
          print(
              "notification_due="
              + str(meta["notificationDue"]).lower()
          )
          print(
              "notification_reason="
              + str(meta.get("notificationReason") or "none")
          )
          PY

      - name: Update programme translations
        if: github.event_name != 'push'
        id: programme_translations
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured; skipping programme translations."
            exit 0
          fi
          python scripts/update_programme_translations.py

      - name: Report programme translation failure
        if: >-
          github.event_name != 'push' &&
          steps.programme_translations.outcome == 'failure'
        run: |
          echo "::warning title=Programme translation update failed::The data pipeline succeeded, but DeepSeek translation failed. Successfully checkpointed batches will still be included in the automated publication pull request."
          {
            echo "### Programme translation warning"
            echo ""
            echo "The application-data pipeline succeeded, but the optional DeepSeek translation step failed."
            echo "Successfully checkpointed translation batches are preserved and the automated publication pull request will still be created."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit translation-only refresh
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.translation_only &&
          steps.programme_translations.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/programme-translations.json
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
            exit 0
          fi
          git commit -m "data: translate published programmes"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Test refreshed data before publication
        if: github.event_name != 'push' && !inputs.translation_only
        run: pytest -q

      - name: Maintain one adapter-health issue
        if: >-
          github.event_name != 'push' &&
          !inputs.translation_only &&
          steps.daily_pipeline.outcome == 'success' &&
          steps.adapter_health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_MAINTENANCE: ${{ steps.adapter_health.outputs.needs_maintenance }}
          NOTIFICATION_DUE: ${{ steps.adapter_health.outputs.notification_due }}
          NOTIFICATION_REASON: ${{ steps.adapter_health.outputs.notification_reason }}
        shell: bash
        run: |
          title="Adapter maintenance required"
          report="data/ops/reports/programme-adapter-health.md"
          issue_number="$(
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title $title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1
          )"

          if [ "$NEEDS_MAINTENANCE" -gt 0 ]; then
            if [ -z "$issue_number" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$title" --body-file "$report" \
                --assignee "$GITHUB_REPOSITORY_OWNER"
            else
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
                --body-file "$report"
              if [ "$NOTIFICATION_DUE" = "true" ]; then
                if [ "$NOTIFICATION_REASON" = "weekly-reminder" ]; then
                  gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
                    --body "Weekly consolidated adapter-maintenance reminder: $NEEDS_MAINTENANCE schools currently need attention. The issue body contains the latest school-level summary."
                fi
              fi
            fi
          elif [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --comment "All dedicated adapter maintenance alerts have cleared."
          fi

      - name: Open or update automated data publication pull request
        if: github.event_name != 'push' && !inputs.translation_only
        id: data-pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "data: refresh application windows"
          branch: automation/application-data
          delete-branch: true
          title: "data: publish automated application-window refresh"
          body: |
            Automated daily refresh of monitoring state, parser candidates,
            programme-discovery candidates, predictions, evidence snapshots,
            coverage, and review reports.

            Dedicated adapters automatically promote only complete application
            windows with official exact opening and closing dates. Inferred or
            incomplete windows and parser date changes remain unpublished.
          add-paths: |
            data/applications.json
            data/predictions.json
            data/programs.json
            data/refresh-status.json
            data/programme-translations.json
            data/evidence/
            data/coverage.json
            data/ops/
            README.md
            README.zh-CN.md

      - name: Merge validated data publication
        if: >-
          github.event_name != 'push' &&
          !inputs.translation_only &&
          steps.data-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr merge "${{ steps.data-pr.outputs.pull-request-number }}"
          --repo "$GITHUB_REPOSITORY"
          --squash
          --delete-branch

      - name: Test and deploy refreshed production site
        if: >-
          github.event_name != 'push' &&
          !inputs.translation_only &&
          steps.data-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          tests_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref main

          tests_run_id=""
          for _ in $(seq 1 30); do
            tests_run_id="$(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml \
                --event workflow_dispatch --limit 10 \
                --json databaseId,headSha,createdAt \
                --jq ".[] | select(.headSha == \"$head_sha\" and .createdAt >= \"$tests_started_at\") | .databaseId" \
                | head -n 1
            )"
            if [ -n "$tests_run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$tests_run_id" ]; then
            echo "Unable to locate the dispatched Tests run." >&2
            exit 1
          fi
          gh run watch "$tests_run_id" --repo "$GITHUB_REPOSITORY" --exit-status

          pages_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "tests_run_id=$tests_run_id"

          pages_run_id=""
          for _ in $(seq 1 30); do
            pages_run_id="$(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml \
                --event workflow_dispatch --limit 10 \
                --json databaseId,headSha,createdAt \
                --jq ".[] | select(.headSha == \"$head_sha\" and .createdAt >= \"$pages_started_at\") | .databaseId" \
                | head -n 1
            )"
            if [ -n "$pages_run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$pages_run_id" ]; then
            echo "Unable to locate the dispatched Pages deployment." >&2
            exit 1
          fi
          gh run watch "$pages_run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Maintain update workflow failure issue
        if: >-
          always() &&
          github.event_name != 'push' &&
          !inputs.translation_only
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          title="Application-data refresh failed"
          issue_number="$(
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title $title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1
          )"

          if [ "$JOB_STATUS" = "failure" ]; then
            body="$(printf '%s\n\n%s\n\n%s\n' \
              'The scheduled application-data refresh failed.' \
              "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              'This issue is updated in place and closes automatically after the next successful full refresh.')"
            if [ -z "$issue_number" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$title" --body "$body" \
                --assignee "$GITHUB_REPOSITORY_OWNER"
            else
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
                --body "$body"
            fi
          elif [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --reason completed
          fi
